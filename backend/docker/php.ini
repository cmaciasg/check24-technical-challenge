; Los logs los escribe Monolog en php://stderr; los errores de PHP también van ahí.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.validate_timestamps = 0

; Memoria compartida del pool: aquí viven los contadores de Prometheus (observability.md §3.5).
apc.enabled = 1
apc.shm_size = 64M

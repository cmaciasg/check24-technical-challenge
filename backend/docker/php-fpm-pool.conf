[www]
; Al menos providers + 1 workers: la petición de POST /comparison espera mientras los tres
; providers simulados atienden a la vez (architecture.md §3). Con menos, las llamadas se serializan.
pm = static
pm.max_children = 8

; Las variables de entorno del contenedor deben llegar a PHP (Symfony las lee en ejecución).
clear_env = no

; Sin esto se descartan los logs JSON de los workers (observability.md §4.1).
catch_workers_output = yes
decorate_workers_output = no

# Registra solo método y ruta, nunca el cuerpo (observability.md §4.5).
log_format minimal '$request_method $uri $status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout minimal;

    # El frontend llama a la ruta relativa /comparison; aquí se reenvía al backend (architecture.md §5.6).
    # Solo esta ruta: /metrics y los endpoints simulados nunca se exponen hacia fuera.
    location = /comparison {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}

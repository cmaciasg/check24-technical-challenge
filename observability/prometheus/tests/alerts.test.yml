        values: '0+10x40'
      - series: 'comparison_duration_seconds_bucket{le="3"}'
        values: '0+10x40'
      - series: 'comparison_duration_seconds_bucket{le="5"}'
        values: '0+10x40'
      - series: 'comparison_duration_seconds_bucket{le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ComparisonLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "El p95 de POST /comparison supera 2,3 s (línea base ≈ 2,0 s)"
              action: "Comparar con comparison_overhead_seconds: si sube, el retraso es propio; si no, mirar la latencia por provider."


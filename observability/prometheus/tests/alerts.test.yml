# Tests de las reglas de alerta con promtool (observability.md §10, TC-O4).
# Para cada alerta: un caso que la dispara y otro que no. Además, la guarda de tráfico mínimo, el
# umbral por defecto frente a la excepción de provider-c y BackendDown.
# Se ejecutan con `make test-alerts`. Generado con series sintéticas de 1 muestra por minuto.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # TC-O4 — BackendDown dispara
  - interval: 1m
    input_series:
      - series: 'up{job="backend"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
            exp_annotations:
              summary: "El backend no responde al scrape de /metrics"
              action: "Revisar que el contenedor backend esté arrancado y sus logs de arranque."

  # TC-O4 — BackendDown no dispara con el backend arriba
  - interval: 1m
    input_series:
      - series: 'up{job="backend"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: BackendDown
        exp_alerts: []

  # TC-O4 — ComparisonErrors dispara con un 10 % de 500
  - interval: 1m
    input_series:
      - series: 'comparison_requests_total{outcome="error"}'
        values: '0+2x40'
      - series: 'comparison_requests_total{outcome="complete"}'
        values: '0+18x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComparisonErrors
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Más del 1 % de las comparaciones acaban en 500"
              action: "Es un fallo propio, nunca de un provider: buscar comparison.failed en los logs (exception_class y traza)."

  # TC-O4 — ComparisonErrors no dispara sin errores
  - interval: 1m
    input_series:
      - series: 'comparison_requests_total{outcome="error"}'
        values: '0x40'
      - series: 'comparison_requests_total{outcome="complete"}'
        values: '0+20x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComparisonErrors
        exp_alerts: []

  # TC-O4 — ComparisonErrors guarda de tráfico mínimo: un error suelto con poco volumen no dispara
  - interval: 1m
    input_series:
      - series: 'comparison_requests_total{outcome="error"}'
        values: '0 0 0 1 1 1 2 2 2 3 3 3 4 4 4 5 5 5 6 6 6 7 7 7 8 8 8 9 9 9 10 10 10 11 11 11 12 12 12 13 13'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComparisonErrors
        exp_alerts: []

  # TC-O4 — ComparisonErrors ignora los 400 (solo dashboard)
  - interval: 1m
    input_series:
      - series: 'comparison_requests_total{outcome="error"}'
        values: '0x40'
      - series: 'comparison_requests_total{outcome="invalid"}'
        values: '0+50x40'
      - series: 'comparison_requests_total{outcome="complete"}'
        values: '0+20x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComparisonErrors
        exp_alerts: []

  # TC-O4 — ComparisonEmptyResults dispara con un 10 % de vacías
  - interval: 1m
    input_series:
      - series: 'comparison_requests_total{outcome="empty"}'
        values: '0+2x40'
      - series: 'comparison_requests_total{outcome="complete"}'
        values: '0+18x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComparisonEmptyResults
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Más del 5 % de las comparaciones no devuelve ninguna oferta"
              action: "Los tres providers fallan a la vez (línea base 0 %): mirar provider.call.failed y sospechar de red o del cliente HTTP propio."

  # TC-O4 — ComparisonEmptyResults no dispara sin resultados vacíos
  - interval: 1m

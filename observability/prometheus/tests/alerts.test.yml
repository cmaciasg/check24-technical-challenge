      - series: 'comparison_duration_seconds_bucket{le="2.5"}'
        values: '0+10x40'
      - series: 'comparison_duration_seconds_bucket{le="3"}'
        values: '0+10x40'
      - series: 'comparison_duration_seconds_bucket{le="5"}'
        values: '0+10x40'
      - series: 'comparison_duration_seconds_bucket{le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ComparisonLatencyHigh
        exp_alerts: []

  # TC-O4 — ComparisonLatencyHigh guarda de tráfico mínimo

      - series: 'comparison_duration_seconds_bucket{le="1.5"}'
        values: '0x40'
      - series: 'comparison_duration_seconds_bucket{le="1.75"}'
        values: '0x40'
      - series: 'comparison_duration_seconds_bucket{le="2"}'
